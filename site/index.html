<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skill previews</title>
  <style>
    :root{color-scheme:light dark;font-family:Arial,sans-serif;background:#fff;color:#10131f}
    *{box-sizing:border-box}body{max-width:760px;margin:0 auto;padding:64px 24px}
    h1{font-size:32px;font-weight:500;letter-spacing:-.04em;margin:0 0 12px}
    p{line-height:1.6;color:#646b7c}a{color:inherit;text-underline-offset:4px}
    .preview{display:block;margin:32px 0;padding:24px;border:1px solid #e5e7ed;border-radius:14px;text-decoration:none}
    .preview:hover{background:#f6f7fa}.preview strong{font-size:20px;font-weight:500}.preview p{margin:8px 0 0}
    a:focus-visible{outline:2px solid #0b70c0;outline-offset:4px}footer{font-size:13px;color:#646b7c}
    @media(prefers-color-scheme:dark){:root{background:#0b0d16;color:#e8eaf2}p,footer{color:#9ba1b5}.preview{border-color:#282d40}.preview:hover{background:#181c2c}}
  </style>
</head>
<body>
  <h1>Skill previews</h1>
  <p>Interactive tools for trying the skills in this repository. No account or installation required.</p>
  <a class="preview" href="./thermal-svg/">
    <strong>Thermal SVG →</strong>
    <p>Tune animated thermal lettering, inspect the complete code, and copy or download the SVG.</p>
  </a>
  <footer><a href="https://github.com/vcfgdev/skills">Source &amp; agent skills</a></footer>
</body>
</html>
